name: Test
# Pull requests only. Actions are pinned to full commit SHAs (the commits their v4.4.0 tags named on 2026-10-16).
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Dependency lifecycle scripts are not needed to build or test; do not run them.
      - run: npm ci --ignore-scripts
      - run: npm test
